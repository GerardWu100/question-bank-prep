# The same service as docker-compose.example.yml, built from this checkout
# instead of pulled. Put STUDY_PASSWORD=<a password> in .env first.
services:
  question-bank-prep:
    build:
      context: .
      target: app
    container_name: question-bank-prep
    ports:
      - "127.0.0.1:6848:3000"
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - TZ=America/Toronto
      - STUDY_PASSWORD=${STUDY_PASSWORD:?Set STUDY_PASSWORD in .env}
      - AI_MAX_REQUESTS_PER_HOUR=${AI_MAX_REQUESTS_PER_HOUR:-60}
      - AI_MAX_REQUESTS_PER_DAY=${AI_MAX_REQUESTS_PER_DAY:-300}
    volumes:
      - $HOME/.containers/question-bank-prep:/data
      - $HOME/projects/cfa/question_bank:/question_bank:ro
      - $HOME/projects/cfa/md_materials:/materials:ro
      # Only the Codex login file and the model list, never the whole ~/.codex folder.
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /codex/auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.codex/models_cache.json
        target: /codex/models_cache.json
        read_only: true
        bind:
          create_host_path: false
