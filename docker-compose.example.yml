# Run the published image without cloning the repository. This file is all
# the server needs; save it as docker-compose.yml in an empty folder.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d
#
# Before the first start, as yourself (not with sudo), in the folder holding
# this docker-compose.yml:
#   mkdir -p ~/.containers/question-bank-prep
#   echo "HOST_UID=$(id -u)" >> .env
#   echo "HOST_GID=$(id -g)" >> .env
#   echo "STUDY_PASSWORD=<a password>" >> .env
# The folder must exist and belong to you: a missing one stops the start with
# "bind source path does not exist" instead of Docker creating it for root,
# which the app could not write. A login is required because the container
# listens beyond the server itself.
#
# `docker-compose.yml` in the repository is the same service built from a
# local checkout instead of pulled.
services:
  question-bank-prep:
    # `latest` follows main. To pin, use a release instead: `1` (every 1.x
    # release), `1.0` (fixes only), or `1.0.0` (exactly that release).
    image: ghcr.io/gerardwu100/question-bank-prep:latest
    container_name: question-bank-prep
    ports:
      # Open to every device that can reach the server, over plain HTTP.
      # Fine on a home network. On the internet, put an HTTPS reverse proxy in
      # front and let only it reach the app: use "127.0.0.1:6848:3000", or drop
      # this line when the proxy joins the "single" network below.
      - "6848:3000"
    restart: unless-stopped
    # Run as your own user so the database belongs to you and the ChatGPT
    # sign-in (mode 600, owned by you) stays readable and refreshable. HOST_UID
    # and HOST_GID come from .env (`id -u` and `id -g`, see the top).
    user: "${HOST_UID:?Set HOST_UID=$(id -u) in .env}:${HOST_GID:?Set HOST_GID=$(id -g) in .env}"
    environment:
      - TZ=America/Toronto
      # Required; read from the .env file next to this compose file.
      - STUDY_PASSWORD=${STUDY_PASSWORD:?Set STUDY_PASSWORD in .env next to docker-compose.yml}
      # true when a reverse proxy serves this app over HTTPS: the login cookie is
      # then Secure and the login limit counts each visitor. Headers count only
      # from a proxy on this machine or a private (Docker) network. Keep false
      # when the app is reached directly.
      - TRUST_PROXY=false
      # Most AI model requests the whole app may send (all connections, backups
      # included), so a leaked password cannot drain your plan or API credit. One tutor reply is 1 request plus 1 per
      # tool round (at most 6). Whole numbers; 0 means no cap.
      - AI_MAX_REQUESTS_PER_HOUR=30
      - AI_MAX_REQUESTS_PER_DAY=150
    volumes:
      # Folder on your machine, then the path inside the container. Edit the
      # left side to keep files somewhere else; keep the right side as it is.
      # Database and backups. Long form so a missing folder is an error, not a
      # new root-owned folder (create it first, see the top):
      - type: bind
        source: ${HOME}/.containers/question-bank-prep
        target: /data
        bind:
          create_host_path: false
      # Question banks (one folder per topic); synced every time the app opens:
      # Long form too: a missing (unmounted, mistyped) folder would otherwise be
      # mounted empty, and the folder sync would then remove every bank file.
      - type: bind
        source: ${HOME}/projects/cfa/question_bank
        target: /question_bank
        read_only: true
        bind:
          create_host_path: false
      # Study notes shown on the Materials page and searched by the tutor:
      - type: bind
        source: ${HOME}/projects/cfa/md_materials
        target: /materials
        read_only: true
        bind:
          create_host_path: false
      # The ChatGPT sign-in folder: only its auth.json is read. Make the file with
      # one-time-projects/codex-auth-maker (no Codex CLI needed); the app then
      # refreshes it and keeps a lock folder beside it, so mount it read-write and
      # make it writable by the user above. A Codex CLI folder (~/.codex) also
      # works, read-only in effect: Codex keeps refreshing it. Without a sign-in
      # only the ChatGPT connection is off; API-key connections still answer.
      - ${CODEX_HOME:-${HOME}/.codex}:/codex
    networks:
      - single

networks:
  # Shared network where a reverse proxy can reach this container. Compose
  # joins it if it exists and creates it if it does not.
  single:
    name: single
